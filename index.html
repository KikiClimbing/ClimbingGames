<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeux d'escalade</title>
<style>
:root{--navy:#26364D;--text:#2B2F36;--muted:#6B7280;--bg:#F7F8FB;--side:268px}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}
a{color:inherit}
.side{position:fixed;top:0;bottom:0;left:0;width:var(--side);background:#fff;border-right:1px solid #E5E8EF;overflow-y:auto;padding:18px 12px 24px;z-index:10;display:flex;flex-direction:column}
.brand{padding:4px 10px 14px;cursor:pointer}.brand h1{margin:0;font-size:22px;color:var(--navy)}.brand small{display:block;font-size:11px;letter-spacing:1px;color:var(--muted)}
.sec{font-size:11px;font-weight:700;letter-spacing:1.5px;color:#9AA3B2;margin:16px 10px 5px}
.nav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:15px;border:0;background:transparent;width:100%;text-align:left;font-family:inherit;color:var(--text)}
.nav:hover{background:#F0F3F9}.nav.on{background:var(--navy);color:#fff}.nav .dot{width:11px;height:11px;border-radius:50%;flex:none}.nav .n{margin-left:auto;font-size:12px;opacity:.6}
.nav .ic{width:18px;text-align:center;flex:none}
.propose{margin:auto 4px 0;display:block;text-align:center;background:var(--navy);color:#fff;border-radius:9px;padding:10px;font-weight:700;text-decoration:none}
.bar{display:none;position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #E5E8EF;padding:10px 14px;align-items:center;gap:12px}.bar b{color:var(--navy);font-size:18px}.burger{border:0;background:#EEF1F8;border-radius:8px;font-size:22px;padding:2px 11px;cursor:pointer}
.shade{display:none;position:fixed;inset:0;background:rgba(20,28,40,.45);z-index:9}
main{margin-left:var(--side);padding:26px 32px 60px;max-width:1260px}
h2.pt{margin:0 0 4px;font-size:28px;color:var(--navy)}.lead{color:var(--muted);margin:0 0 18px;max-width:760px;line-height:1.45}
.search{width:100%;max-width:640px;padding:12px 16px;border:1px solid #D5DAE5;border-radius:12px;font:inherit;font-size:16px;background:#fff}
.hero{background:linear-gradient(135deg,#26364D,#3d5679);color:#fff;border-radius:18px;padding:30px 30px 26px;margin-bottom:22px}
.hero h2{margin:0 0 6px;font-size:32px}.hero p{margin:0 0 16px;opacity:.9;max-width:620px;line-height:1.45}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px;margin-bottom:24px}
.tile{background:var(--l);border-top:6px solid var(--a);border-radius:12px;padding:16px 18px 18px;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tile:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.14)}.tile .k{font-size:40px;font-weight:700;color:var(--d);line-height:1}.tile h3{margin:2px 0 4px;color:var(--d);font-size:20px}.tile .c{font-size:13px;font-weight:700;color:var(--d);margin-bottom:6px}.tile p{margin:0;font-size:14px;line-height:1.4;color:#3a4150}
.sh{font-size:12px;font-weight:700;letter-spacing:1.5px;color:#7a8497;margin:22px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #D5DAE5;background:#fff;border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--text)}.chip:hover{border-color:var(--navy)}.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 16px}.tools .grow{flex:1;min-width:200px}
.seg{display:inline-flex;border:1px solid #D5DAE5;border-radius:9px;overflow:hidden}.seg button{border:0;background:#fff;padding:7px 14px;font:inherit;cursor:pointer}.seg button.on{background:var(--navy);color:#fff}
.count{color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--l);border-top:5px solid var(--a);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.14)}
.card img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover}
.gen{aspect-ratio:3/2;background:var(--m);color:var(--d);display:flex;flex-direction:column;justify-content:center;padding:18px}.gen .c{font-size:54px;font-weight:700;line-height:1}.gen .t{font-size:20px;font-weight:700}
.meta{padding:10px 14px 13px;font-size:14px;color:var(--d);display:flex;flex-wrap:wrap;gap:6px}.meta span{background:var(--m);border-radius:14px;padding:2px 10px;font-weight:700;font-size:13px}
.empty{padding:50px;text-align:center;color:var(--muted)}
table.lst{width:100%;border-collapse:separate;border-spacing:0 5px}.lst th{font-size:11px;letter-spacing:1px;color:#7a8497;text-align:left;padding:4px 12px}
.lst td{background:var(--l);padding:10px 12px;font-size:14px}.lst tr.r{cursor:pointer}.lst tr.r:hover td{filter:brightness(.97)}
.lst td:first-child{background:var(--m);color:var(--d);font-weight:700;border-radius:8px 0 0 8px;text-align:center;width:64px}.lst td:last-child{border-radius:0 8px 8px 0}.lst td b{color:var(--d)}
.box{background:#fff;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.07);line-height:1.5}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.xc{background:#FBF4DC;border-top:5px solid #E3C463;border-radius:10px;padding:14px 18px}.xc h4{margin:0 0 6px;color:#86690F;font-size:17px}.xc p{margin:0;font-size:14.5px;line-height:1.45}.xc .num{font-size:26px;font-weight:700;color:#E3C463;margin-right:6px}
.tl{width:100%;border-collapse:separate;border-spacing:0 4px}.tl td{background:#FBF4DC;padding:9px 12px;font-size:14px;vertical-align:top}.tl td:first-child{background:#F3E4AE;color:#86690F;font-weight:700;white-space:nowrap;width:70px}
.gl{display:grid;grid-template-columns:200px 1fr;gap:4px}.gl dt{background:#F3E4AE;color:#86690F;font-weight:700;padding:8px 12px}.gl dd{background:#FBF4DC;margin:0;padding:8px 12px;font-size:14.5px}
.lk{font-weight:700;cursor:pointer;text-decoration:underline;margin-right:8px;white-space:nowrap}
.warn{background:#FDEBE3;padding:10px 20px;margin:0 0 14px;font-size:14px;border-radius:8px;display:none}
.hide{display:none!important}
/* fiche */
.ov{position:fixed;inset:0;background:rgba(20,28,40,.55);display:none;z-index:20;overflow:auto;padding:24px 12px}.ov.open{display:block}
.fiche{max-width:900px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.fh{display:flex;background:var(--l)}.fh .code{background:var(--m);color:var(--d);font-size:46px;font-weight:700;display:flex;align-items:center;justify-content:center;min-width:110px}
.fh .tt{padding:16px 20px;flex:1}.fh .fam{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--d)}.fh h2{margin:2px 0 4px;font-size:30px;color:var(--d)}.fh .br{font-style:italic;color:var(--muted)}
.x{border:0;background:transparent;font-size:30px;cursor:pointer;color:var(--d);padding:0 18px;align-self:flex-start}
.tabs{display:flex;gap:2px;background:var(--l);padding:0 14px;border-bottom:3px solid var(--m);overflow-x:auto}
.tab{border:0;background:transparent;padding:11px 18px;font:inherit;font-weight:700;color:var(--d);cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap}.tab.on{background:#fff;box-shadow:0 -3px 0 var(--a) inset}
.pane{padding:20px 24px 26px;display:none;line-height:1.5}.pane.on{display:block}
.pane p{margin:0 0 12px;white-space:pre-wrap}.pane img{width:100%;border:3px solid var(--m);border-radius:10px;margin-top:6px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{background:var(--l);padding:10px 14px;border-radius:8px}.fact b{display:block;font-size:11px;letter-spacing:1px;color:var(--d)}
.obj{grid-column:1/-1;background:var(--m);font-weight:700;color:var(--d)}
.var{display:grid;grid-template-columns:1fr 1fr;gap:14px}.var>div{background:var(--l);padding:12px 16px;border-top:4px solid var(--a);border-radius:6px;white-space:pre-wrap}.var>div:last-child{background:var(--m);border-color:var(--d)}.var h4{margin:0 0 6px;color:var(--d);letter-spacing:1px;font-size:13px}
.tip{background:#FFF6DB;border-left:5px solid #E3C463;padding:12px 16px;border-radius:4px;margin-bottom:14px}
.voir a{display:inline-block;margin:0 10px 6px 0;font-weight:700;color:var(--d);cursor:pointer}
.comp{background:var(--l);padding:12px 16px;border-radius:8px;white-space:pre-wrap;font-size:15px}
.foot{padding:12px 24px;background:#F7F8FB;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.warn{background:#FDEBE3;padding:10px 20px;margin:0;font-size:14px;display:none}
@media(max-width:860px){.side{transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}.side.open{transform:none}.shade.open{display:block}.bar{display:flex}main{margin-left:0;padding:18px 14px 50px}.hero{padding:22px 18px}.hero h2{font-size:25px}.gl{grid-template-columns:1fr}.lst .hm{display:none}}
@media(max-width:640px){.facts,.var{grid-template-columns:1fr}.fh .code{min-width:76px;font-size:32px}.fh h2{font-size:22px}.pane{padding:16px}}
@media print{.side,.bar,.x,.tabs,.foot,main,.shade{display:none!important}.ov{position:static;display:block;background:none;padding:0}.pane{display:block!important}.fiche{box-shadow:none}}
</style></head><body>

<script>
const CONFIG=Object.assign({SHEET_CSV_URL:"",FORM_URL:"",TEMPLATE_SEANCE_URL:"",TEMPLATE_CYCLE_URL:"",LIBRARY_URL:""},window.SITE_CONFIG||{});

const OBJS=["Échauffement","Équilibre","Coopération","Vitesse","Observation"];
const EMBED=[{"Code": "E1", "Titre": "Suis-moi / À la trace", "Famille": "Exploration", "Résumé": "Suivre son partenaire sur les mêmes prises", "Principe": "Suis-moi : Par 2 ou 3, suivre son partenaire en utilisant les mêmes prises, de mains, de pieds ou les deux.\n\nÀ la trace : Suivre quelqu’un en n’utilisant que les prises saisies, dans l’ordre, avec les mains, les pieds ou les deux, comme si le suiveur posait ses pieds dans les traces de l’autre dans la neige.", "Participants": "Par 2 ou 3, tout le groupe en parallèle", "Matériel": "Aucun", "Espace": "Pan de mur ou traversée, faible hauteur", "Durée": "5 à 10 min", "Objectif": "Observation et mémorisation d’un trajet de prises", "Plus facile": "• Ne suivre que les prises de mains\n• Trajet court de 5 à 6 prises, grosses et proches\n• Le meneur annonce chaque prise à voix haute", "Plus difficile": "• Respecter l’ordre exact des prises (« à la trace »)\n• Le suiveur part quand le meneur a déjà fait 3 mouvements\n• Le meneur change de direction : monter, descendre, revenir", "Conseil": "Changer de meneur à chaque passage et rester à faible hauteur.", "Voir aussi": "E2, G2", "Effectif court": "Groupe, par 2-3", "Intensité": "Calme", "Objectifs (tags)": "Observation", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "E2", "Titre": "Nénuphar", "Famille": "Exploration", "Résumé": "Ne saisir que les prises marquées d’un scotch", "Principe": "Se déplacer sur les murs en ne saisissant que certaines prises qui ont un scotch collé. Les prises sont touchées par les mains ou par les pieds, selon la consigne.", "Participants": "Individuel, groupe entier", "Matériel": "Scotch ou ruban adhésif", "Espace": "Murs de la salle", "Durée": "5 à 10 min", "Objectif": "Choix des prises, lecture du mur", "Plus facile": "• Nombreuses prises scotchées, proches les unes des autres\n• Mains et pieds autorisés sur toutes les prises scotchées", "Plus difficile": "• Peu de prises scotchées, espacées\n• Deux couleurs de scotch : une pour les mains, une pour les pieds\n• Parcours en descente ou en dévers", "Conseil": "Prévoir plusieurs parcours en parallèle pour que tout le monde grimpe en même temps.", "Voir aussi": "E1, E3", "Effectif court": "Individuel, groupe", "Intensité": "Calme", "Objectifs (tags)": "Observation", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "E3", "Titre": "Twister", "Famille": "Exploration", "Résumé": "Placer ses appuis sur la couleur annoncée", "Principe": "Au signal de l’éducateur, tous s’agrippent au mur en plaçant leurs appuis, mains et pieds, sur les prises de la couleur indiquée (par exemple : toutes les vertes).", "Participants": "Groupe entier", "Matériel": "Prises de couleurs différentes", "Espace": "Murs de la salle", "Durée": "5 à 10 min", "Objectif": "Réactivité, repérage des couleurs", "Plus facile": "• Couleur très présente sur le mur, avec beaucoup de prises\n• Laisser 10 secondes pour réagir", "Plus difficile": "• Une couleur pour les mains, une autre pour les pieds\n• Réaction en moins de 5 secondes\n• Le dernier en place sort du jeu", "Conseil": "", "Voir aussi": "G1", "Effectif court": "Groupe entier", "Intensité": "Modérée", "Objectifs (tags)": "Échauffement, Observation", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "E4", "Titre": "La cueillette des pommes", "Famille": "Exploration", "Résumé": "Toucher un maximum de prises avec les mains, depuis deux prises de pieds imposées", "Principe": "Par deux, l’un après l’autre. Deux prises de pieds sont imposées et il est interdit de poser les pieds sur d’autres prises. Le grimpeur peut intervertir ses pieds entre ces deux prises, ce qui l’oblige à changer de position, et touche avec les mains le plus de prises possible. Celui qui en touche le plus gagne.", "Participants": "Binômes", "Matériel": "Aucun", "Espace": "Pan de mur", "Durée": "5 min par manche", "Objectif": "Équilibre, amplitude, placement du bassin", "Plus facile": "• Pieds fixes : chaque pied reste sur sa prise, sans intervertir\n• Prises de pieds grosses et à bonne hauteur\n• Compter aussi les prises touchées d’une seule main", "Plus difficile": "• Un seul pied au mur, sur l’une des deux prises : l’autre jambe reste en l’air\n• Prises de pieds petites\n• Temps limité à 20 secondes", "Conseil": "", "Voir aussi": "D11", "Effectif court": "Binômes", "Intensité": "Calme", "Objectifs (tags)": "Équilibre", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "E5", "Titre": "Via ferrata", "Famille": "Exploration", "Résumé": "Faire glisser sa dégaine le long d’une cordelette", "Principe": "Une cordelette est accrochée en zig-zag, avec des plaquettes, aux murs et au plafond. Chaque personne se déplace en faisant glisser sa dégaine (ou un mousqueton) le long de la corde. On ne doit ni attraper la corde, ni accrocher la dégaine sur soi. À chaque obstacle, il faut décrocher puis raccrocher sa dégaine pour avancer.", "Participants": "Individuel, les uns après les autres", "Matériel": "Cordelette, plaquettes, dégaines ou mousquetons", "Espace": "Salle entière, murs et plafond ; installation préalable", "Durée": "10 à 15 min", "Objectif": "Manipulation de la dégaine, déplacement continu", "Plus facile": "• Parcours bas, sur un seul mur\n• Obstacles espacés, peu nombreux\n• Autoriser une pause sur de grosses prises pour changer la dégaine", "Plus difficile": "• Parcours qui passe par le plafond et les dévers\n• Parcours chronométré\n• Faire le circuit en aller-retour sans poser le pied au sol", "Conseil": "Vérifier la fixation des plaquettes avant le jeu ; un seul grimpeur par section de parcours.", "Voir aussi": "E6, E2", "Effectif court": "Un à la fois", "Intensité": "Modérée", "Objectifs (tags)": "Équilibre", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "E6", "Titre": "Zig-zag", "Famille": "Exploration", "Résumé": "Se déplacer sous ou au-dessus d’élastiques tendus", "Principe": "Sur les pans de mur, un ou plusieurs élastiques sont tendus en zig-zag. Chacun se déplace en respectant la consigne annoncée : mains et pieds sous l’élastique, ou seulement les deux mains sous l’élastique, ou seulement les deux pieds au-dessus.", "Participants": "Individuel ou par 2", "Matériel": "Élastiques", "Espace": "Pan de mur", "Durée": "5 à 10 min", "Objectif": "Coordination, repérage dans l’espace", "Plus facile": "• Un seul élastique, tendu large\n• Une seule consigne pour tout le parcours (tout en dessous)", "Plus difficile": "• Plusieurs élastiques qui se croisent\n• Consigne différente pour les mains et pour les pieds\n• Changement de consigne au signal de l’éducateur", "Conseil": "", "Voir aussi": "E2, E7", "Effectif court": "Seul ou par 2", "Intensité": "Calme", "Objectifs (tags)": "Équilibre", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "E7", "Titre": "Le puits / Dedans ou dehors", "Famille": "Exploration", "Résumé": "Grimper autour ou dans des cerceaux fixés au mur", "Principe": "Le puits : Contourner complètement un cerceau accroché à plat contre le mur, sans le toucher ni utiliser de prises à l’intérieur.\n\nDedans ou dehors : Placer des cerceaux à plat contre le mur et se déplacer en utilisant les prises uniquement à l’intérieur, ou uniquement à l’extérieur, avec les mains ou les pieds.", "Participants": "Individuel", "Matériel": "Cerceaux", "Espace": "Pan de mur", "Durée": "5 à 10 min", "Objectif": "Contraintes de prises, lecture du mur", "Plus facile": "• Grand cerceau, placé sur une zone riche en prises\n• Contrainte seulement sur les mains", "Plus difficile": "• Cerceau placé sur une zone pauvre en prises\n• Contrainte sur les mains et les pieds\n• Enchaîner deux cerceaux avec des consignes opposées (dedans puis dehors)", "Conseil": "", "Voir aussi": "C7, E6", "Effectif court": "Individuel", "Intensité": "Calme", "Objectifs (tags)": "Équilibre, Observation", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "E8", "Titre": "Handi-grimpe", "Famille": "Exploration", "Résumé": "Grimper avec une balle en main ou une seule jambe", "Principe": "Se déplacer sur les murs en tenant une balle dans une main, ou en n’utilisant qu’une seule jambe.", "Participants": "Individuel, groupe entier", "Matériel": "Balles", "Espace": "Traversée, faible hauteur", "Durée": "5 min", "Objectif": "Sensibilisation au handicap, usage différent des appuis", "Plus facile": "• Balle grosse et légère\n• Traversée courte\n• Changer de main (ou de jambe) à mi-parcours", "Plus difficile": "• Petite balle qu’il faut serrer\n• Parcours plus long ou en dévers\n• Cumuler les deux contraintes : une balle et une seule jambe", "Conseil": "Faire verbaliser les ressentis après le jeu.", "Voir aussi": "G4", "Effectif court": "Groupe entier", "Intensité": "Calme", "Objectifs (tags)": "Équilibre", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "E9", "Titre": "Colin-Maillard", "Famille": "Exploration", "Résumé": "Toucher des grimpeurs les yeux bandés", "Principe": "Une (ou deux) personne(s) a les yeux bandés et doit toucher les autres, qui se déplacent au mur à 1 mètre maximum du sol. Un joueur touché, ou qui retombe au sol, est éliminé.", "Participants": "Groupe entier, 1 ou 2 poursuivants", "Matériel": "Bandeau(x)", "Espace": "Pied de mur, hauteur limitée à 1 m", "Durée": "5 à 10 min", "Objectif": "Déplacement discret, écoute", "Plus facile": "• Zone de jeu réduite\n• Le groupe laisse échapper des indices sonores (claquement de mains)", "Plus difficile": "• Deux poursuivants\n• Zone de jeu plus large\n• Les grimpeurs restent silencieux", "Conseil": "Tapis en place et hauteur limitée à 1 m ; l’éducateur surveille le poursuivant aux yeux bandés.", "Voir aussi": "C1, C2", "Effectif court": "Groupe, 1-2 poursuivants", "Intensité": "Calme", "Objectifs (tags)": "Observation", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "C1", "Titre": "Lapin-chasseur", "Famille": "Coopération", "Résumé": "Un chasseur à quatre pattes poursuit les lapins", "Principe": "Au départ, un chasseur est à quatre pattes au centre de la salle et doit toucher les autres personnes (les lapins), qui se transforment alors en chasseurs. Le ou la dernière touché(e) sera le chasseur à la partie suivante. Pour toucher un lapin accroché au mur, il faut aussi être accroché.", "Participants": "Groupe entier", "Matériel": "Aucun", "Espace": "Salle entière", "Durée": "10 min", "Objectif": "Déplacements variés, esquive", "Plus facile": "• Un tapis « refuge » où l’on ne peut pas être touché\n• Chasseur qui se déplace lentement", "Plus difficile": "• Deux chasseurs dès le départ\n• Aucune zone refuge\n• Lapins obligés de traverser la salle à chaque manche", "Conseil": "", "Voir aussi": "E9, C2, D8", "Effectif court": "Groupe entier", "Intensité": "Intense", "Objectifs (tags)": "Échauffement", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "C2", "Titre": "Le loup glacé", "Famille": "Coopération", "Résumé": "Un loup grimpe et glace les brebis, qu’on délivre en les touchant", "Principe": "But du jeu : Le loup doit « glacer » (immobiliser) toutes les brebis, c’est-à-dire les autres grimpeurs. Les brebis grimpent et se déplacent pour échapper au loup, tout en délivrant leurs partenaires déjà glacés.\n\nDéroulement : Les brebis grimpent et s’éparpillent ; le loup leur laisse quelques secondes d’avance, puis monte à son tour. Dès qu’il touche le pied ou la jambe d’une brebis (jamais le haut du corps), elle est glacée : elle s’immobilise sur ses prises. Pour la délivrer, une brebis libre grimpe jusqu’à elle et lui touche une prise ou le pied. La manche s’arrête quand tout le monde est glacé ou quand le temps est écoulé. Le premier glacé devient loup à la manche suivante.", "Participants": "Groupe entier, 1 loup (premier grimpeur désigné)", "Matériel": "Aucun", "Espace": "Zone de bloc à faible hauteur, avec une ligne à ne pas dépasser", "Durée": "3 à 5 min par manche", "Objectif": "Entraide, esquive, endurance", "Plus facile": "• Zone de jeu réduite (un ou deux pans)\n• Loup des couleurs : le loup annonce une couleur de prise ; une brebis qui a une main ou un pied dessus est immunisée\n• Loup qui se déplace lentement", "Plus difficile": "• Variante « sans fin » : une brebis touchée devient loup, et l’ancien loup redevient brebis\n• Deux loups\n• Brebis glacée : elle redescend et se tient debout, jambes et bras écartés ; une autre la délivre en passant entre ses jambes", "Conseil": "Interdit de sauter du mur pour fuir, de pousser un camarade ou de faire des mouvements brusques. Tapis épais et ligne de hauteur à ne pas dépasser. Manches courtes : rester sur le mur fatigue vite.", "Voir aussi": "E9, C1", "Effectif court": "Groupe, 1 loup", "Intensité": "Intense", "Objectifs (tags)": "Échauffement, Coopération", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "C3", "Titre": "À l’aveugle", "Famille": "Coopération", "Résumé": "Grimper les yeux bandés, guidé par la voix d’un partenaire", "Principe": "Sur un bloc existant : Par deux : l’un grimpe les yeux bandés pendant que l’autre, au sol, le guide uniquement avec la voix (haut, bas, gauche, droite) jusqu’à une prise cible. Le grimpeur ne voit rien et doit tâter les prises.\n\nSur un parcours créé au fur et à mesure : Pas de parcours prévu : le guide choisit la prochaine prise au dernier moment et la décrit (couleur, position). Le grimpeur la cherche et l’utilise, puis le guide choisit la suivante. On construit ainsi un parcours unique à chaque passage.", "Participants": "Binômes (un grimpeur, un guide)", "Matériel": "Bandeau, tapis", "Espace": "Un bloc ou une traversée basse", "Durée": "10 min", "Objectif": "Confiance, communication, sens du toucher", "Plus facile": "• Prise cible à portée de bras\n• Le guide peut toucher la main du grimpeur pour l’orienter\n• Bloc connu, avec de grosses prises", "Plus difficile": "• Consignes uniquement orales, sans toucher\n• Guider avec des repères de couleur seulement (« prends la jaune à ta droite »)\n• Prise cible plus éloignée, ou parcours chronométré", "Conseil": "Rester bas (pieds à 1 m du sol au maximum), tapis sous le bloc et un pareur à côté du grimpeur. Échanger les rôles à chaque passage.", "Voir aussi": "C4, C5, E1", "Effectif court": "Binômes", "Intensité": "Calme", "Objectifs (tags)": "Coopération", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "C4", "Titre": "La Dictée", "Famille": "Coopération", "Résumé": "Guider un grimpeur qui voit, prise après prise", "Principe": "2 équipes, en traversée de part et d’autre du mur. Un grimpeur par équipe. Chaque membre de l’équipe, à tour de rôle, lui montre du doigt la prochaine prise de main jusqu’à toucher la prise finale. S’il tombe, on change de grimpeur. Variante : traversée complète, les équipes partent à tour de rôle et on chronomètre.", "Participants": "2 équipes de 2 à 3 enfants", "Matériel": "Chrono (variante)", "Espace": "Traversée", "Durée": "10 min", "Objectif": "Observation, lecture du mur, esprit d’équipe", "Plus facile": "• Prise cible à portée de bras\n• Le guide a le droit de nommer la couleur de la prise", "Plus difficile": "• Le guide montre sans parler (mime ou geste uniquement)\n• Traversée complète chronométrée\n• Un seul essai : une chute fait changer de grimpeur", "Conseil": "À faire avec peu d’enfants à la fois pour que tous puissent grimper, idéalement en binôme ou par équipe de 3.", "Voir aussi": "C3, C5, E1", "Effectif court": "2 équipes de 2-3", "Intensité": "Calme", "Objectifs (tags)": "Observation, Coopération", "Format anniversaire": "OUI", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "C5", "Titre": "La cordée", "Famille": "Coopération", "Résumé": "Se déplacer reliés par une sangle de 1 m", "Principe": "Par 2, puis par 3, puis par 4, puis en groupe complet, il s’agit de se déplacer encordés par une sangle de 1 m de longueur entre chaque personne. But : ne pas se décrocher et garder la sangle le plus souvent tendue.", "Participants": "De 2 à tout le groupe, de façon progressive", "Matériel": "Sangles de 1 m", "Espace": "Traversée longue, faible hauteur", "Durée": "10 min", "Objectif": "Synchronisation, communication", "Plus facile": "• Groupes de 2\n• Sangle plus longue\n• Traversée courte", "Plus difficile": "• Groupes de 4 ou plus\n• Sangle plus courte (50 cm)\n• Changements de direction et interdiction de parler", "Conseil": "Tenir la sangle à la main : ne jamais l’enrouler ni la passer autour du cou ou de la taille.", "Voir aussi": "C6", "Effectif court": "De 2 à tout le groupe", "Intensité": "Modérée", "Objectifs (tags)": "Coopération", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "C6", "Titre": "Saute-mouton", "Famille": "Coopération", "Résumé": "Dépasser le grimpeur de devant sur le mur", "Principe": "Par deux, puis à trois, etc. : à chacun son tour, l’un doit surpasser la personne devant et se repositionner un peu plus loin sur le mur. Les contournements peuvent se faire soit dans le dos, soit devant le ventre de l’autre accroché, ou en alternance.", "Participants": "De 2 à 4 par groupe", "Matériel": "Aucun", "Espace": "Traversée, faible hauteur", "Durée": "10 min", "Objectif": "Dépassement, communication", "Plus facile": "• Groupes de 2\n• Mur très garni, grosses prises\n• Contournement libre", "Plus difficile": "• Groupes de 4\n• Contournement imposé en alternance\n• Parcours long, sans poser le pied au sol", "Conseil": "", "Voir aussi": "D7, C5", "Effectif court": "2 à 4 par groupe", "Intensité": "Modérée", "Objectifs (tags)": "Coopération", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "C7", "Titre": "Tunnel", "Famille": "Coopération", "Résumé": "Passer dans des cerceaux perpendiculaires au mur", "Principe": "Positionner des cerceaux perpendiculairement aux parois, sur les murs. Il s’agit de se déplacer en passant dans les cerceaux sans les toucher.\n\nVariante à 2 équipes : Les uns se déplacent en passant alternativement au-dessus puis en dessous de bâtons tenus horizontalement, en appui sur le mur, par les autres personnes.", "Participants": "Individuel, ou 2 équipes (variante)", "Matériel": "Cerceaux, bâtons", "Espace": "Pan de mur", "Durée": "10 min", "Objectif": "Passage du corps, souplesse", "Plus facile": "• Grands cerceaux, peu nombreux\n• Bâtons tenus haut, bien écartés", "Plus difficile": "• Cerceaux plus petits ou plus rapprochés\n• Bâtons plus bas\n• Parcours chronométré sans toucher", "Conseil": "Fixer les cerceaux solidement ; ne pas laisser les bâtons dépasser du mur.", "Voir aussi": "E7", "Effectif court": "Individuel ou 2 équipes", "Intensité": "Modérée", "Objectifs (tags)": "Équilibre, Coopération", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "C8", "Titre": "La balle assise", "Famille": "Coopération", "Résumé": "Se lancer un ballon sur le mur : touché, on se fige ; on se délivre en attrapant le ballon", "Principe": "Lancer et être touché : Chacun pour soi, sur un mur de bloc à faible hauteur ou une traversée basse. Les grimpeurs se déplacent sur le mur. Celui qui attrape le ballon en mousse s’immobilise sur ses prises et doit obligatoirement le lancer. Un grimpeur touché de volée devient une statue : il ne bouge plus ni les pieds ni les mains.\n\nSe délivrer : Une statue est délivrée si elle intercepte le ballon (tir raté sur elle, ou balle qui rebondit près d’elle) en l’attrapant sans bouger ses appuis. Elle peut alors se déplacer de nouveau. Le dernier joueur libre gagne. Un joueur qui lâche le mur pour fuir est considéré comme statue.", "Participants": "Groupe entier, chacun pour soi", "Matériel": "Ballon en mousse ultra-léger, tapis", "Espace": "Mur de bloc à faible hauteur ou traversée basse", "Durée": "10 min", "Objectif": "Agilité, gestion des appuis, observation du jeu", "Plus facile": "• Zone de jeu réduite\n• Lancers à la main, à faible distance\n• Statue délivrée aussi si elle touche le ballon, sans forcément l’attraper", "Plus difficile": "• Ballon à rattraper d’une seule main\n• Deux ballons en jeu\n• Version assise : le touché descend s’asseoir sur le tapis, et se délivre en touchant un joueur debout avec le ballon ou en le passant à un joueur assis", "Conseil": "Ballon en mousse uniquement, jamais à la tête. Ne pas viser un grimpeur en posture instable ou trop haut. Interdit de sauter du mur pour esquiver : le joueur qui tombe sur le tapis devient statue.", "Voir aussi": "C9, D9", "Effectif court": "Groupe entier", "Intensité": "Intense", "Objectifs (tags)": "Échauffement", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "C9", "Titre": "Balle assise par équipes", "Famille": "Coopération", "Résumé": "Deux équipes sur le mur : on libère un coéquipier en lui passant le ballon", "Principe": "Lancer et être touché : Deux équipes (par exemple bleus contre rouges), toutes sur un mur de bloc à faible hauteur ou une traversée basse. On ne lance que sur un adversaire. Celui qui attrape le ballon en mousse s’immobilise sur ses prises et doit le lancer. Un grimpeur touché de volée devient une statue : il ne bouge plus ni les pieds ni les mains.\n\nSe délivrer et gagner : Un coéquipier libre peut délivrer une statue en lui passant le ballon : la statue l’attrape sans bouger ses appuis, puis elle peut se déplacer de nouveau. Une statue peut aussi se délivrer en interceptant un ballon adverse. Une équipe gagne quand tous ses adversaires sont des statues, ou, à la fin du temps, quand elle a le moins de statues.", "Participants": "2 équipes à effectifs égaux", "Matériel": "Ballon en mousse ultra-léger, tapis, chasubles de deux couleurs", "Espace": "Mur de bloc à faible hauteur ou traversée basse", "Durée": "10 min", "Objectif": "Tactique d’équipe, passes, entraide", "Plus facile": "• Zone de jeu réduite\n• Une statue est délivrée dès qu’elle touche le ballon\n• Lancers à la main, à faible distance", "Plus difficile": "• Un seul ballon par équipe, qui ne doit jamais tomber au sol\n• Le joueur qui a le ballon n’a que 5 secondes pour lancer\n• Ballon à rattraper d’une seule main", "Conseil": "Ballon en mousse uniquement, jamais à la tête. Ne pas viser un grimpeur en posture instable ou trop haut. Interdit de sauter du mur : le joueur qui tombe sur le tapis devient statue. Prévoir des chasubles pour bien distinguer les équipes.", "Voir aussi": "C8, D9", "Effectif court": "2 équipes égales", "Intensité": "Intense", "Objectifs (tags)": "Coopération", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "C10", "Titre": "La Tour Eiffel", "Famille": "Coopération", "Résumé": "Gravir 324 m en équipe en montées-redescentes", "Principe": "Par équipe, gravir 324 m en réalisant des montées-redescentes sur les murs de la salle. Dans une salle de 3 m de haut, 324 m équivaut à 54 montées-redescentes, réalisées par 9 personnes 6 fois, ou 6 personnes 9 fois, ou 3 personnes 18 fois.", "Participants": "Équipes de 3, 6 ou 9", "Matériel": "Aucun (feuille de comptage conseillée)", "Espace": "Murs de la salle (hauteur de 3 m dans l’exemple)", "Durée": "10 à 20 min", "Objectif": "Endurance collective, volume", "Plus facile": "• Objectif réduit : 162 m, soit 27 montées-redescentes\n• Relais libre, sans ordre de passage", "Plus difficile": "• Objectif relevé : 432 m, soit 72 montées-redescentes\n• Descente en désescalade, sans sauter\n• Passage obligatoire sur des pans différents", "Conseil": "Échauffer les avant-bras et faire tourner les grimpeurs pour limiter la fatigue.", "Voir aussi": "C11", "Effectif court": "Équipes de 3, 6 ou 9", "Intensité": "Intense", "Objectifs (tags)": "Coopération", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "C11", "Titre": "L’addition", "Famille": "Coopération", "Résumé": "Cumuler des points en montées-redescentes, sur des pans plus ou moins difficiles", "Principe": "Marquer des points : Réaliser des montées-redescentes en touchant le plafond avec le pied et le sol avec la main. Chaque pan vaut de 1 à 5 points selon sa difficulté : 1 point pour un pan facile, 5 points pour un pan difficile. Les points ne comptent que si la montée-redescente est validée. Chaque pan ne rapporte qu’une seule fois à l’équipe.\n\nStratégie et contrôle : Les coéquipiers doivent donc se répartir les pans : les plus forts prennent les pans à 5 points, les autres les pans faciles. Une équipe joue 2 minutes pendant que l’autre contrôle chaque grimpeur adverse. Gagne l’équipe qui cumule le plus de points.", "Participants": "2 équipes", "Matériel": "Chrono, feuille de points", "Espace": "Plusieurs pans de mur, jusqu’au plafond", "Durée": "2 min par équipe et par manche", "Objectif": "Stratégie, répartition des rôles, endurance", "Plus facile": "• Tous les pans valent le même nombre de points\n• Repères placés à mi-hauteur à la place du plafond\n• Manche de 90 secondes", "Plus difficile": "• Manche de 3 minutes\n• Le pan à 5 points ne compte que s’il est validé au premier essai\n• Un seul contrôleur pour toute l’équipe adverse", "Conseil": "Afficher la valeur de chaque pan avant le départ et classer les pans selon leur vraie difficulté (hauteur, taille des prises). Désigner un contrôleur par grimpeur pour éviter les contestations.", "Voir aussi": "C10", "Effectif court": "2 équipes", "Intensité": "Intense", "Objectifs (tags)": "Vitesse, Coopération", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "C12", "Titre": "Statue", "Famille": "Coopération", "Résumé": "Mimer une forme ou un objet sur le mur", "Principe": "Il s’agit de faire une figure sur le mur (seul ou à plusieurs) qui représente une forme géométrique, une lettre de l’alphabet, un objet, un animal… à découvrir par les autres personnes du groupe.", "Participants": "Seul ou en groupes de 2 à 4", "Matériel": "Aucun", "Espace": "Pan de mur", "Durée": "10 min", "Objectif": "Créativité, placement du corps", "Plus facile": "• Figures simples imposées (lettre, étoile)\n• Autoriser les pieds au sol", "Plus difficile": "• Figure à plusieurs (3 à 4 personnes) en contact avec le mur\n• Mot entier épelé par le groupe\n• Tenir la figure 10 secondes sans bouger", "Conseil": "", "Voir aussi": "G1", "Effectif court": "Seul ou 2 à 4", "Intensité": "Calme", "Objectifs (tags)": "Équilibre", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "D1", "Titre": "La chenille", "Famille": "Défis", "Résumé": "En file indienne, toucher la prise centrale avant l’autre équipe", "Principe": "Le dispositif : Une seule traversée. Deux équipes équilibrées partent chacune d’une extrémité du mur. Une prise est repérée exactement au milieu (par un scotch, par exemple).\n\nLe jeu : Les équipes s’organisent : les plus rapides partent en premier. Tous les membres d’une équipe partent à la queue leu leu, comme une chenille, et chacun doit toucher la prise centrale. La première équipe dont tous les membres l’ont touchée gagne. On change ensuite de côté pour que ce soit équitable.", "Participants": "2 équipes à effectifs égaux", "Matériel": "Scotch ou foulard pour repérer la prise centrale", "Espace": "Une traversée, départs aux deux extrémités", "Durée": "5 à 10 min", "Objectif": "Organisation d’équipe, vitesse, lecture du mur", "Plus facile": "• Traversée courte, prise centrale placée bas\n• Un essai sans chrono ni gagnant pour s’organiser\n• Chaque équipe a sa propre ligne de prises, sans croisement près de la prise centrale", "Plus difficile": "• Départs décalés : le suivant ne part que quand le précédent est à mi-chemin\n• Retour obligatoire sur le mur, en traversée, après avoir touché la prise\n• Traversée plus longue, prise centrale en hauteur", "Conseil": "Laisser une minute aux équipes pour s’organiser. Vérifier que la prise est vraiment au milieu, et prévoir assez de largeur de mur : les deux équipes se croisent près de la prise centrale. Changer de côté à chaque manche.", "Voir aussi": "D2, D3, D8", "Effectif court": "2 équipes égales", "Intensité": "Modérée", "Objectifs (tags)": "Vitesse, Coopération", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "D2", "Titre": "Rapid’accroche", "Famille": "Défis", "Résumé": "S’accrocher au plus vite au mur : le dernier accroché fait perdre un point à son équipe", "Principe": "Une manche : Deux équipes en nombre égal, derrière une ligne de départ à 4 ou 5 m d’un mur partagé en deux moitiés égales : chaque équipe fait face à sa moitié (ou à un mur opposé s’il y en a deux). Au signal, chaque enfant rejoint son mur et s’y accroche au plus vite, sur n’importe quelle prise, un peu comme aux chaises musicales. Le dernier enfant accroché, toutes équipes confondues, fait perdre 1 point à son équipe. On revient au sol et on relance.\n\nLes points : Chaque équipe part avec 5 points. La première équipe à 0 point perd la partie. Être « accroché » veut dire : les deux pieds décollés du sol, les deux mains sur des prises, tenu 2 secondes. On peut faire la revanche en inversant les pans à monter.", "Participants": "2 équipes à effectifs égaux", "Matériel": "Aucun, un arbitre qui annonce le dernier", "Espace": "Un mur partagé en deux moitiés égales (ou deux murs opposés), ligne de départ à 4 ou 5 m", "Durée": "5 à 10 min", "Objectif": "Vitesse, réactivité, départ groupé", "Plus facile": "• Distance courte entre les deux murs\n• Rejoindre le mur en marchant vite plutôt qu’en courant\n• Départ à 7 points par équipe, pour avoir le temps de se rattraper", "Plus difficile": "• Départ à 3 points par équipe\n• Tenir 5 secondes accroché pour être validé\n• Moins de prises que d’enfants sur chaque moitié", "Conseil": "Équilibrer les équipes en nombre et en niveau, et alterner ou mélanger les équipes entre les parties : le même enfant ne doit pas être toujours le dernier. Séparer les deux moitiés par un scotch et une zone neutre, prévoir assez de prises pour que tous s’accrochent en même temps, et de bons tapis.", "Voir aussi": "D1, D3", "Effectif court": "2 équipes égales", "Intensité": "Intense", "Objectifs (tags)": "Vitesse", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "D3", "Titre": "Les déménageurs", "Famille": "Défis", "Résumé": "Rapporter foulards ou dégaines dans son camp", "Principe": "Variante A · foulards : 2 équipes, en traversée de part et d’autre du mur. Chaque membre de l’équipe traverse jusqu’au cerceau posé au sol qui contient des foulards. Il doit attraper un foulard sans mettre le pied au sol et le ramener dans son camp (un cerceau au sol). Le suivant part quand l’enfant descend du mur et a posé son foulard dans le cerceau. La première équipe qui a ramené tous ses foulards gagne (ou chrono : au bout de 5 min, on compte les foulards ramenés).\n\nVariante B · bataille de dégaines : Sur deux pans de mur opposés, des dégaines sont accrochées, en nombre égal, sur une corde tendue à 3 m de hauteur. Au signal, les deux équipes, de part et d’autre de la salle, doivent ramener les dégaines dans leur camp. À la fin de la période de jeu, l’équipe gagnante est celle qui a le plus de dégaines accrochées à la corde. Variante : accrocher ses dégaines dans le camp adverse.\n\nVariante C · déménagement : Sur un pan de mur, deux équipes de 2 ou 3 joueurs ont un lot de 10 dégaines accrochées, dans leur camp, à un mousqueton à vis sur une plaquette. Gagne l’équipe qui replace, avant l’autre, toutes ses dégaines sur une sangle située au milieu du pan de mur (un simple cercle fixé au mur suffit : on y clippe les dégaines).", "Participants": "2 équipes de 2 à 6", "Matériel": "Foulards et cerceaux (A) ; dégaines, corde, sangle, mousquetons (B et C)", "Espace": "Traversée ou deux pans de mur opposés", "Durée": "5 min par manche (A) ; 10 min (B et C)", "Objectif": "Course en équipe, transport d’objets", "Plus facile": "• Un seul objet à rapporter par joueur, traversée courte\n• Autoriser un pied au sol pour attraper l’objet", "Plus difficile": "• Aucun appui au sol sur tout le parcours\n• Plus d’objets à rapporter\n• Dégaines à replacer par couleur ou dans un ordre imposé", "Conseil": "Vérifier que les mousquetons sont bien verrouillés et les dégaines en bon état.", "Voir aussi": "D1, D5", "Effectif court": "2 équipes de 2-6", "Intensité": "Intense", "Objectifs (tags)": "Vitesse", "Format anniversaire": "OUI", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "D4", "Titre": "Le béret", "Famille": "Défis", "Résumé": "Récupérer le béret au milieu du mur avant l’adversaire", "Principe": "2 équipes avec des numéros attribués à chacun. L’éducateur appelle un numéro : les deux joueurs qui le portent partent en même temps récupérer le béret accroché au milieu du mur, entre les deux équipes. Celui qui le prend doit revenir dans son embut sans être touché par l’adversaire. S’il y parvient, son équipe marque un point ; s’il est touché, le point va à l’équipe adverse.", "Participants": "2 équipes numérotées", "Matériel": "Un béret ou un objet", "Espace": "Mur central et deux embuts", "Durée": "10 min", "Objectif": "Réactivité, stratégie", "Plus facile": "• Béret accroché bas\n• Retour à l’embut sans risque d’être touché", "Plus difficile": "• Deux numéros appelés en même temps\n• Béret accroché plus haut\n• Retour obligatoire en restant au mur (traversée)", "Conseil": "", "Voir aussi": "D1", "Effectif court": "2 équipes numérotées", "Intensité": "Intense", "Objectifs (tags)": "Vitesse", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "D5", "Titre": "Relais-vitesse", "Famille": "Défis", "Résumé": "Relais en montée-descente entre deux équipes sur deux blocs en hauteur", "Principe": "Relais en montée-descente : Deux équipes s’affrontent en relais, chacune sur son bloc en hauteur (deux murs différents). Chaque grimpeur monte toucher une prise repère tout en haut, puis redescend en désescalade : interdit de sauter. Dès qu’il a les deux pieds au sol, il tape dans la main du suivant, qui peut partir. Le match comporte deux manches, en changeant de mur. Gagne l’équipe qui remporte en premier 2 manches.\n\nVariante · en traversée : Au lieu de monter, chaque grimpeur fait une traversée d’un bout à l’autre du mur, puis le relais se fait par une tape dans la main au bout du parcours. Même règle : deux manches en changeant de mur, et la première équipe à 2 manches gagne.", "Participants": "2 équipes", "Matériel": "Aucun (témoin possible), tapis épais", "Espace": "Deux blocs en hauteur distincts (ou deux murs)", "Durée": "10 min", "Objectif": "Vitesse, relais, maîtrise de la descente", "Plus facile": "• Prise repère à mi-hauteur\n• Équipes plus petites, donc moins d’allers-retours pour chacun\n• Version en traversée, parcours court", "Plus difficile": "• Témoin à transporter (balle, foulard) pendant la montée-descente\n• Prise repère plus haute ou plus difficile\n• Version en traversée sans poser le pied au sol, sur des murs plus techniques", "Conseil": "Choisir deux murs de difficulté équivalente, avec des tapis épais. Un adulte vérifie que la descente se fait bien en désescalade, jamais en sautant.", "Voir aussi": "D6, D1", "Effectif court": "2 équipes", "Intensité": "Intense", "Objectifs (tags)": "Vitesse", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "D6", "Titre": "Le relais à 3", "Famille": "Défis", "Résumé": "Une balle passe de grimpeur en grimpeur", "Principe": "Par équipes de 3, chaque équipe part à tour de rôle pour une traversée. Chaque membre de l’équipe est positionné à un tiers du parcours. Le premier doit grimper avec une balle dans la main et la faire passer au suivant. Le dernier doit déposer la balle dans la prise d’arrivée. On chronomètre chaque équipe ; l’équipe la plus rapide gagne.\n\nVariante : On compte le nombre de prises de mains utilisées par chaque équipe. Celle qui en a utilisé le moins gagne.", "Participants": "Équipes de 3", "Matériel": "Balle, chrono", "Espace": "Traversée", "Durée": "10 min", "Objectif": "Transmission, rapidité", "Plus facile": "• Parcours plus court\n• Passage de relais par simple tape dans la main", "Plus difficile": "• Pénalité de 5 secondes si la balle tombe\n• Parcours plus long\n• Compter les prises de mains en plus du chrono", "Conseil": "", "Voir aussi": "D5", "Effectif court": "Équipes de 3", "Intensité": "Modérée", "Objectifs (tags)": "Vitesse", "Format anniversaire": "OUI", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "D7", "Titre": "Croisement", "Famille": "Défis", "Résumé": "Deux grimpeurs se croisent sur une traversée", "Principe": "Pierre-Feuille-Ciseaux : 2 équipes, chacune d’un côté du mur. Au signal, un enfant de chaque équipe part vers l’autre bout ; les autres suivent dès que possible. Quand deux enfants se croisent : pierre-feuille-ciseaux. Le perdant redescend et retourne dans sa file, le gagnant continue. La première équipe à faire traverser tous ses membres gagne.\n\nLe roi de la traversée : Face à face, ils doivent trouver comment se dépasser sans tomber. Interdiction de passer par-dessus l’autre : on se croise à la même hauteur. Une fois dépassés, chacun continue son chemin. Oblige à observer l’autre grimpeur et à chercher une solution.", "Participants": "2 équipes de 3 à 6", "Matériel": "Aucun", "Espace": "Traversée basse", "Durée": "10 min", "Objectif": "Observer l’autre grimpeur, chercher une solution", "Plus facile": "• Prises larges et nombreuses sur la traversée\n• Un seul croisement à la fois", "Plus difficile": "• Traversée étroite, peu de prises\n• Un des grimpeurs porte une balle\n• Se croiser sans poser un pied au sol", "Conseil": "Prévoir un tapis sur toute la traversée.", "Voir aussi": "C6, D1", "Effectif court": "2 équipes de 3-6", "Intensité": "Calme", "Objectifs (tags)": "Observation, Équilibre", "Format anniversaire": "OUI", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "D8", "Titre": "La queue du diable", "Famille": "Défis", "Résumé": "Attraper le foulard de l’autre sans perdre le sien", "Principe": "Par deux (puis par 3, puis en équipe), chacun a un foulard accroché à la taille et doit attraper celui de l’autre sans faire prendre le sien. Celui qui a un pied au sol ne peut pas attraper un foulard, mais reste vulnérable.", "Participants": "2, puis 3, puis par équipes", "Matériel": "Foulards", "Espace": "Pan de mur", "Durée": "5 à 10 min", "Objectif": "Esquive, déplacements rapides", "Plus facile": "• Zone de jeu réduite\n• Foulard long et bien visible\n• Duels à deux seulement", "Plus difficile": "• Une seule main autorisée pour attraper\n• Équipes de 3 contre 3\n• Interdiction de poser un pied au sol", "Conseil": "Glisser le foulard dans la ceinture sans le nouer : il doit se détacher facilement.", "Voir aussi": "C1", "Effectif court": "2, 3 ou équipes", "Intensité": "Intense", "Objectifs (tags)": "Échauffement", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "D9", "Titre": "Jeu de massacre", "Famille": "Défis", "Résumé": "Esquiver un ballon en mousse sans toucher terre", "Principe": "Le dispositif : Deux équipes : l’une sur le mur (les grimpeurs), l’autre au sol (les tireurs), à 4 ou 5 m selon les pratiquants. Avec un ballon en mousse, les tireurs essaient de toucher les grimpeurs, qui tentent d’esquiver sans toucher terre. Un grimpeur est vaincu s’il est touché au tronc ou s’il pose un pied au sol.\n\nScore et fin : Manche chronométrée de 2 minutes : les tireurs marquent 1 point par grimpeur vaincu, et la manche s’arrête si tous sont vaincus. Les équipes inversent les rôles à la 2e manche. L’équipe qui a vaincu le plus de grimpeurs sur les deux manches gagne ; en cas d’égalité, celle qui a été la plus rapide pour tous les vaincre.", "Participants": "2 équipes", "Matériel": "Ballon en mousse (1 pour 3 ou 4 tireurs), chrono, tapis", "Espace": "Un pan de mur et une zone de tir de 4 à 5 m", "Durée": "10 min", "Objectif": "Esquive, agilité", "Plus facile": "• Tireurs à 5 m\n• Ballon très léger\n• Grimpeurs à faible hauteur", "Plus difficile": "• Tireurs à 4 m\n• Un membre touché ne peut plus servir à s’agripper\n• Deux ballons en jeu, à viser sur des grimpeurs différents", "Conseil": "Ballon en mousse uniquement ; viser le tronc et les jambes, jamais la tête ; tapis en place. Prévoir un ballon pour 3 ou 4 tireurs : deux ballons dès 6 tireurs.", "Voir aussi": "C8", "Effectif court": "2 équipes", "Intensité": "Intense", "Objectifs (tags)": "Échauffement", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "D10", "Titre": "Pas de géant / Défi au Géomag", "Famille": "Défis", "Résumé": "Atteindre une cible en touchant le moins de prises", "Principe": "Les pas de géant : Atteindre une prise-cible en touchant le moins de prises possible, chacun son tour.\n\nLe défi au Géomag : Par deux, une personne place un aimant (« Géomag ») à un endroit de son choix et défie son adversaire d’aller le récupérer, et ainsi de suite. Gagne celui qui touche le moins de prises avec les mains (si différence de taille, le plus grand doit en toucher moins).", "Participants": "Individuel à tour de rôle, ou binôme", "Matériel": "Aimant Géomag (version duel)", "Espace": "Pan de mur", "Durée": "10 min", "Objectif": "Efficacité du geste, amplitude", "Plus facile": "• Cible proche\n• Ne compter que les prises de mains", "Plus difficile": "• Compter les mains et les pieds\n• Cible éloignée\n• Le défieur doit réussir lui-même son défi", "Conseil": "", "Voir aussi": "E4, D11, G4", "Effectif court": "Tour à tour ou binôme", "Intensité": "Calme", "Objectifs (tags)": "Équilibre", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "D11", "Titre": "Chrono-prises", "Famille": "Défis", "Résumé": "Toucher un maximum de prises avec les mains en 30 secondes, depuis deux prises de pieds fixes", "Principe": "Par 2, chacun son tour. Deux prises de pieds sont imposées et fixes : un pied sur chacune, sans les échanger, et interdiction d’utiliser d’autres prises pour les pieds. En 30 secondes, le grimpeur touche avec les mains le plus de prises possible ; celui qui en touche le plus gagne. On peut aussi ne compter que la main droite ou que la main gauche.", "Participants": "Binômes", "Matériel": "Chrono", "Espace": "Pan de mur", "Durée": "30 s par passage", "Objectif": "Rapidité, amplitude des gestes", "Plus facile": "• Temps allongé à 45 ou 60 secondes\n• Prises de pieds grosses et à bonne hauteur\n• Autoriser à échanger les pieds entre les deux prises", "Plus difficile": "• Temps réduit à 20 secondes\n• Ne compter que la main non dominante\n• Pas deux fois la même prise\n• Prises de pieds petites ou très écartées", "Conseil": "Un compteur au sol par grimpeur pour annoncer le score.", "Voir aussi": "E4, D10", "Effectif court": "Binômes", "Intensité": "Modérée", "Objectifs (tags)": "Vitesse", "Format anniversaire": "", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "", "Publié": "OUI"}, {"Code": "G1", "Titre": "Jacadi / Mur ensorcelé", "Famille": "Animation", "Résumé": "Obéir aux ordres ou aux sorts de l’éducateur", "Principe": "Jacadi du mur : Si l’ordre est précédé de « Jacadi a dit », il faut obéir ; sinon, ne pas bouger. Celui qui se trompe redescend et recommence en bas. Les ordres sont à varier et à mixer (liste complète page suivante), avec quelques pièges sans la formule.\n\nLe mur ensorcelé : Tous les enfants grimpent sur une traversée basse. L’éducateur annonce régulièrement un sort : Statue ! (tout le monde s’immobilise) · Invisibilité ! (une main dans le dos) · Glace ! (interdiction de bouger les pieds pendant 5 secondes) · Téléportation ! (changer de prise de pied) · Retour dans le temps ! (revenir à la prise précédente). Le dernier à réagir redescend.", "Participants": "Groupe entier", "Matériel": "Aucun", "Espace": "Traversée basse", "Durée": "10 min", "Objectif": "Écoute, réactivité, maîtrise des appuis", "Plus facile": "• Ordres simples (lever une main), rythme lent\n• Pas d’élimination : celui qui se trompe recommence simplement", "Plus difficile": "• Deux ordres à la suite\n• Rythme rapide, avec plusieurs pièges\n• Ordres combinant mains et pieds", "Conseil": "Rester à faible hauteur et surveiller les enfants qui redescendent.", "Voir aussi": "E3, C12", "Effectif court": "Groupe entier", "Intensité": "Calme", "Objectifs (tags)": "Échauffement, Observation", "Format anniversaire": "OUI", "Statut": "Publié", "Auteur": "Christophe", "Compléments": "BANQUE D’ORDRES\n1. Jacadi a dit : Levez une main\n2. Jacadi a dit : Levez un pied\n3. Jacadi a dit : Touchez une prise jaune\n4. Jacadi a dit : Touchez une prise avec votre coude\n5. Jacadi a dit : Montez d’une prise\n6. Jacadi a dit : Descendez d’une prise\n7 function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){r.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);rows.push(r);r=[];f=""}else f+=c}if(f!==""||r.length){r.push(f);rows.push(r)}
 const h=rows.shift().map(x=>x.trim());return rows.filter(x=>x.some(y=>y.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}
const FDEF={k:"?",l:"#FBF4DC",m:"#F3E4AE",d:"#86690F",a:"#E3C463"};
const famOf=g=>FAMS[g.Famille]||FDEF;
const style=g=>{const f=famOf(g);return `--l:${f.l};--m:${f.m};--d:${f.d};--a:${f.a}`};
function driveImg(u){const m=String(u||"").match(/(?:\/d\/|[?&]id=)([\w-]{15,})/);return m&&/drive\.google/.test(u)?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1600":u}
const pubOK=g=>/^(oui|yes|true|1|x|✓)$/i.test(g["Publié"]||"");
const isEmb=g=>g.Code&&EMBED.some(e=>e.Code===g.Code);
const isAnniv=g=>/oui|checked|✓|true/i.test(g["Format anniversaire"]||"");
const noMat=g=>/^(aucun|—)/i.test((g["Matériel"]||"").trim());
const key=g=>g.Code||g.Titre;
async function loadSheet(){
  if(!CONFIG.SHEET_CSV_URL)return;
  try{const r=await fetch(CONFIG.SHEET_CSV_URL,{cache:"no-store"});if(!r.ok)throw 0;
    const rows=parseCSV(await r.text()).filter(pubOK).filter(g=>g.Titre);if(rows.length)DATA=rows;
  }catch(e){const w=$("#warn");if(w){w.style.display="block";w.textContent="La feuille Google n'a pas pu être chargée : affichage de la dernière version enregistrée dans le site."}}
}
function thumb(g){const fb=`<div class="gen"><div class="c">${esc(g.Code||"★")}</div><div class="t">${esc(g.Titre)}</div></div>`;
  if(isEmb(g))return `<img loading="lazy" src="cartes/${esc(g.Code)}.jpg" alt="${esc(g.Titre)}">`;
  const s=driveImg(g["Schéma (lien)"]||g["Schéma"]);
  return s?`<img loading="lazy" src="${esc(s)}" alt="${esc(g.Titre)}" onerror="this.outerHTML=this.dataset.f" data-f="${esc(fb)}">`:fb}
const titleOf=c=>{const g=DATA.find(x=>x.Code===c);return g?g.Titre:""};
const lk=c=>titleOf(c)?`<a class="lk" data-jeu="${esc(c)}" style="color:${(FAMS[(DATA.find(x=>x.Code===c)||{}).Famille]||FDEF).d}">${esc(c)} · ${esc(titleOf(c))}</a>`:`<span>${esc(c)}</span>`;
const lks=arr=>arr.map(lk).join(" ");
const codeLk=c=>titleOf(c)?`<a class="lk" data-jeu="${esc(c)}" style="color:${(FAMS[(DATA.find(x=>x.Code===c)||{}).Famille]||FDEF).d}">${esc(c)}</a>`:esc(c);

/* ---------- navigation ---------- */
const GUIDES=[["secu","Règles de sécurité","⚠"],["materiel","Matériel à préparer","☑"],["seances","Séances types","◷"],["cycle","Progression sur un cycle","↗"],["comp","Compétences travaillées","◎"],["equipes","Former les équipes","⚑"],["gloss","Glossaire","Aa"]];
function viewTitle(v){if(v==="home")return["Accueil",""];if(v==="all")return["Tous les jeux","Le catalogue complet. Utilisez la recherche et les filtres pour trouver le jeu qu'il vous faut."];
  if(v.startsWith("fam/")){const n=decodeURIComponent(v.slice(4));return[n,AX.FAMDESC[n]||""]}
  if(v.startsWith("obj/"))return["Objectif : "+decodeURIComponent(v.slice(4)),"Les jeux qui travaillent cet objectif."];
  if(v==="anniv")return["Format anniversaire","Jeux pensés pour un anniversaire : 6 à 12 enfants de 6 à 11 ans, débutants, environ 1 heure."];
  if(v==="nomat")return["Sans matériel","Jeux qui ne demandent aucun matériel particulier."];
  return["",""]}
function navBtn(v,label,extra=""){return `<button class="nav ${VIEW===v?"on":""}" data-go="${esc(v)}">${extra}${label}</button>`}
function buildNav(){const cnt=f=>DATA.filter(g=>g.Famille===f).length;
  let h=navBtn("home","Accueil",'<span class="ic">⌂</span>');
  h+='<div class="sec">LES JEUX</div>'+navBtn("all",`Tous les jeux<span class="n">${DATA.length}</span>`,'<span class="ic">▦</span>');
  Object.keys(FAMS).forEach(n=>{h+=navBtn("fam/"+n,`${esc(n)}<span class="n">${cnt(n)}</span>`,`<span class="dot" style="background:${FAMS[n].a}"></span>`)});
  h+='<div class="sec">PARCOURIR</div>'+navBtn("anniv","Format anniversaire",'<span class="ic">★</span>')+navBtn("nomat","Sans matériel",'<span class="ic">○</span>');
  OBJS.forEach(o=>{h+=navBtn("obj/"+o,o,'<span class="ic">›</span>')});
  h+='<div class="sec">MES SÉANCES</div>'+navBtn("mes","Séances &amp; cycles",'<span class="ic">✎</span>');
  h+='<div class="sec">GUIDES</div>';GUIDES.forEach(([k,l,i])=>{h+=navBtn("g/"+k,l,`<span class="ic">${i}</span>`)});
  $("#navbox").innerHTML=h}
function go(v){location.hash="#/"+v}
function route(){const h=decodeURIComponent((location.hash||"").replace(/^#\/?/,""));
  if(h.startsWith("jeu/")){MODAL=h.slice(4);if(!$("#main").innerHTML)show("home")}else{MODAL=null;show(h||"home")}
  syncModal()}
function show(v){VIEW=v;S.q=S.q;buildNav();render();$("#side").classList.remove("open");$("#shade").classList.remove("open");window.scrollTo(0,0)}
window.addEventListener("hashchange",route);

/* ---------- listes ---------- */
function filterGames(v){let L=DATA.slice();
  if(v.startsWith("fam/"))L=L.filter(g=>g.Famille===decodeURIComponent(v.slice(4)));
  else if(v.startsWith("obj/")){const o=decodeURIComponent(v.slice(4));L=L.filter(g=>(g["Objectifs (tags)"]||"").split(",").map(s=>s.trim()).includes(o))}
  else if(v==="anniv")L=L.filter(isAnniv);else if(v==="nomat")L=L.filter(noMat);
  if(S.int)L=L.filter(g=>g["Intensité"]===S.int);
  const q=norm(S.q);if(q)L=L.filter(g=>{const hay=norm(Object.values(g).join(" "));return q.split(/\s+/).every(w=>hay.includes(w))});
  return L}
function gridHTML(L){if(!L.length)return '<div class="empty">Aucun jeu ne correspond. Essayez d\'enlever un filtre.</div>';
  if(S.mode==="list")return `<table class="lst"><thead><tr><th>CODE</th><th>JEU</th><th>DURÉE</th><th class="hm">EFFECTIF</th><th class="hm">MATÉRIEL</th><th>INTENSITÉ</th></tr></thead><tbody>`+L.map(g=>`<tr class="r" data-jeu="${esc(key(g))}" style="${style(g)}"><td>${esc(g.Code||"★")}</td><td><b>${esc(g.Titre)}</b><br><span style="color:#6B7280">${esc(g["Résumé"])}</span></td><td>${esc(g["Durée"])}</td><td class="hm">${esc(g["Effectif court"]||g.Participants)}</td><td class="hm">${esc(g["Matériel"])}</td><td>${esc(g["Intensité"])}</td></tr>`).join("")+"</tbody></table>";
  return '<div class="grid">'+L.map(g=>`<div class="card" style="${style(g)}" data-jeu="${esc(key(g))}">${thumb(g)}${isEmb(g)?"":`<div class="meta">${[g.Code||"Nouveau",g["Durée"],g["Effectif court"]].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div>`}</div>`).join("")+"</div>"}
function listView(v){const[t,l]=viewTitle(v);const L=filterGames(v);
  return `<h2 class="pt">${esc(t)}</h2><p class="lead">${esc(l)}</p><p class="warn" id="warn"></p>
  <div class="tools"><input class="search grow" id="q" type="search" placeholder="Rechercher dans cette liste…" value="${esc(S.q)}" autocomplete="off">
  <div class="seg"><button data-mode="grid" class="${S.mode==="grid"?"on":""}">Galerie</button><button data-mode="list" class="${S.mode==="list"?"on":""}">Liste</button></div></div>
  <div class="chips" style="margin-bottom:14px"><span style="align-self:center;font-size:11px;letter-spacing:1px;color:#7a8497;font-weight:700">INTENSITÉ</span>${["Calme","Modérée","Intense"].map(i=>`<button class="chip ${S.int===i?"on":""}" data-int="${i}">${i}</button>`).join("")}</div>
  <p class="count" id="cnt">${L.length} jeu${L.length>1?"x":""}</p><div id="res">${gridHTML(L)}</div>`}

/* ---------- accueil ---------- */
function homeView(){
  const tiles=Object.keys(FAMS).map(n=>{const f=FAMS[n];return `<div class="tile" style="--l:${f.l};--d:${f.d};--a:${f.a}" data-go="fam/${esc(n)}"><div class="k">${f.k}</div><h3>${esc(n)}</h3><div class="c">${DATA.filter(g=>g.Famille===n).length} jeux</div><p>${esc(AX.FAMDESC[n])}</p></div>`}).join("");
  const fresh=DATA.filter(g=>!isEmb(g)).slice(-6).reverse();
  return `<p class="warn" id="warn"></p><div class="hero"><h2>Les jeux d'escalade, prêts à animer</h2><p>${DATA.length} fiches avec schéma, variantes et conseils de sécurité, pour animer des séances d'initiation et des anniversaires.</p><input class="search" id="hq" type="search" placeholder="Rechercher un jeu, un matériel, un mot…" autocomplete="off"></div>
  <div class="sh">CHOISIR UNE FAMILLE</div><div class="tiles">${tiles}</div>
  <div class="sh">ACCÈS RAPIDE</div><div class="chips"><button class="chip" data-go="anniv">★ Format anniversaire</button><button class="chip" data-go="nomat">○ Sans matériel</button>${OBJS.map(o=>`<button class="chip" data-go="obj/${o}">${o}</button>`).join("")}<button class="chip" id="rnd">🎲 Un jeu au hasard</button></div>
  ${fresh.length?`<div class="sh">DERNIÈRES FICHES AJOUTÉES</div>${(S.mode="grid",gridHTML(fresh))}`:""}
  <div class="sh">GUIDES POUR PRÉPARER SA SÉANCE</div><div class="g2">${GUIDES.slice(0,6).map(([k,l,i])=>`<div class="box" style="cursor:pointer;margin:0" data-go="g/${k}"><b style="color:#86690F">${i}  ${l}</b></div>`).join("")}</div>`}

/* ---------- guides ---------- */
function gsec(t,lead){return `<h2 class="pt">${t}</h2><p class="lead">${lead||""}</p>`}
function guideView(k){
  if(k==="secu")return gsec("Règles de sécurité","Huit repères à rappeler avant de lancer un jeu. Ils complètent le règlement de la salle, qui reste prioritaire.")+'<div class="g2">'+AX.SECU.map(([t,x],i)=>`<div class="xc"><h4><span class="num">${String(i+1).padStart(2,"0")}</span>${esc(t)}</h4><p>${esc(x)}</p></div>`).join("")+`</div><div class="box" style="margin-top:16px"><b>Avant chaque jeu</b><ul><li>Annoncer la zone de jeu et ses limites.</li><li>Rappeler le signal d'arrêt.</li><li>Vérifier tapis, sols et zones de réception.</li><li>Faire une démonstration courte avant de lancer.</li></ul></div>`;
  if(k==="materiel")return gsec("Matériel à préparer","Liste à cocher avant la séance, avec les jeux concernés. Quantités conseillées pour 12 enfants, à ajuster.")+`<table class="tl">`+AX.MATOS.map(([m,q,c])=>`<tr><td style="font-size:18px">☐</td><td><b>${esc(m)}</b><br><span style="color:#6B7280;font-size:13px">${esc(q)}</span></td><td>${c.map(x=>/^[ECDG]\d+$/.test(x)?codeLk(x):esc(x)).join(" ")}</td></tr>`).join("")+"</table>";
  if(k==="seances")return gsec("Séances types","Trois déroulés prêts à l'emploi, construits avec les fiches du guide. Les durées sont indicatives.")+AX.SEANCES.map(s=>`<div class="box"><h3 style="margin:0 0 2px;color:#86690F">${esc(s.titre)}</h3><div style="font-size:14px;margin-bottom:10px"><b>Public :</b> ${esc(s.pub)} · <b>Matériel :</b> ${esc(s.mat)}</div><table class="tl">${s.rows.map(([t,ph,c,tip])=>`<tr><td>${esc(t)}</td><td><b>${esc(ph)}</b></td><td>${c?lk(c):"—"}</td><td>${esc(tip)}</td></tr>`).join("")}</table></div>`).join("");
  if(k==="cycle")return gsec("Progression sur un cycle","Une proposition de 8 séances d'une heure, une par semaine, pour des enfants de 7 à 12 ans : accueil, échauffement, 2 à 3 jeux, retour au calme.")+AX.CYCLE.map(([t,o,c,tip],i)=>`<div class="box" style="display:grid;grid-template-columns:64px 1fr;gap:6px 16px"><div style="font-size:30px;font-weight:700;color:#E3C463">S${i+1}</div><div><b style="color:#86690F;font-size:18px">${esc(t)}</b><div style="font-size:14.5px">${esc(o)}</div><div style="margin:8px 0">${lks(c)}</div><div style="background:#FFF6DB;border-left:4px solid #E3C463;padding:6px 12px;font-size:14px"><b>À retenir</b> ${esc(tip)}</div></div></div>`).join("");
  if(k==="comp")return gsec("Compétences travaillées","Pour chaque compétence, les jeux qui la font travailler (les dominantes, pas une liste exhaustive).")+AX.COMP.map(([t,d,c])=>`<div class="box"><b style="color:#86690F;font-size:17px">${esc(t)}</b><div style="font-size:14.5px;color:#6B7280;margin-bottom:6px">${esc(d)}</div>${lks(c)}</div>`).join("");
  if(k==="equipes")return gsec("Former les équipes","Six façons rapides de répartir un groupe, à choisir selon l'âge et l'ambiance.")+'<div class="g2">'+AX.EQUIPES.map(([t,x],i)=>`<div class="xc"><h4><span class="num">${i+1}</span>${esc(t)}</h4><p>${esc(x)}</p></div>`).join("")+`</div><div class="box" style="margin-top:16px"><b>Pour équilibrer</b><ul>${AX.EQ_RULES.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div><div class="box"><b>Quelle taille d'équipe pour quel jeu</b><table class="tl" style="margin-top:8px">${AX.EQ_SIZES.map(([a,b])=>`<tr><td style="white-space:normal">${esc(a)}</td><td>${b.split(" · ").map(codeLk).join(" ")}</td></tr>`).join("")}</table></div>`;
  if(k==="gloss")return gsec("Glossaire","Les mots utilisés dans les fiches.")+'<dl class="gl">'+AX.GLOSS.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")+"</dl>";
  return '<div class="empty">Page introuvable.</div>'}
function copyLink(u){const m=String(u||"").match(/\/d\/([\w-]{15,})/);return m?"https://docs.google.com/document/d/"+m[1]+"/copy":u}
function mesView(){
  const card=(t,txt,url,label,copy)=>`<div class="xc"><h4>${t}</h4><p style="margin-bottom:12px">${txt}</p>${url?`<a class="btn" style="display:inline-block;background:#26364D;color:#fff;border-radius:8px;padding:8px 16px;font-weight:700;text-decoration:none" target="_blank" rel="noopener" href="${esc(copy?copyLink(url):url)}">${label}</a>`:`<span style="color:#9a6b00;font-size:13px">Lien à renseigner par l'administrateur du site.</span>`}</div>`;
  return gsec("Séances &amp; cycles","Créez vos fiches de séance et vos cycles de formation dans Google Docs, puis partagez-les avec les personnes de votre choix.")+
  '<div class="g2">'+card("Créer une fiche de séance","Une copie du modèle s'ouvre dans votre Google Drive : thème, déroulé, exercices avec variantes, critères de réussite, matériel, sécurité.",CONFIG.TEMPLATE_SEANCE_URL,"Créer une séance",true)+
  card("Créer un cycle de formation","Un tableau pour planifier un cycle : séances, thèmes, objectifs, jeux utilisés (par leur code) et bilan.",CONFIG.TEMPLATE_CYCLE_URL,"Créer un cycle",true)+
  card("Bibliothèque partagée","Le dossier où les éducateurs qui le souhaitent déposent leurs séances. Accès réservé aux personnes invitées.",CONFIG.LIBRARY_URL,"Ouvrir la bibliothèque",false)+"</div>"+
  `<div class="box" style="margin-top:16px"><b>Comment partager une séance</b><ol><li>Ouvrez votre séance dans Google Docs.</li><li>Cliquez sur <b>Partager</b>, en haut à droite.</li><li>Saisissez les adresses e-mail des personnes concernées, et choisissez <b>Lecteur</b> ou <b>Éditeur</b>.</li><li>Pour la mettre dans la bibliothèque, glissez-la dans le dossier partagé.</li></ol>Vous seul décidez qui voit votre séance : rien n'est public tant que vous ne l'avez pas décidé.</div>
  <div class="box"><b>Astuce</b> : dans le déroulé, notez le code des jeux du site (E4, D11, G1…) pour les retrouver en un clic.</div>`}
function render(){const v=VIEW;let h;
  if(v==="home")h=homeView();else if(v==="mes")h=mesView();else if(v.startsWith("g/"))h=guideView(v.slice(2));else h=listView(v);
  $("#main").innerHTML=h;
  const hq=$("#hq");if(hq)hq.addEventListener("keydown",e=>{if(e.key==="Enter"){S.q=hq.value;go("all")}});
  const q=$("#q");if(q)q.addEventListener("input",e=>{S.q=e.target.value;const L=filterGames(VIEW);$("#cnt").textContent=L.length+" jeu"+(L.length>1?"x":"");$("#res").innerHTML=gridHTML(L)});
  const r=$("#rnd");if(r)r.addEventListener("click",()=>{const g=DATA[Math.floor(Math.random()*DATA.length)];go("jeu/"+encodeURIComponent(key(g)))})}

/* ---------- fiche ---------- */
function boldTitles(s){return esc(s).replace(/^([^:\n<]{2,48}) : /gm,"<b>$1 :</b> ")}
function openFiche(code){const g=DATA.find(x=>key(x)===code);if(!g)return false;
  const img=isEmb(g)?`schemas/${esc(g.Code)}.webp`:driveImg(g["Schéma (lien)"]||g["Schéma"]);
  const voir=(g["Voir aussi"]||"").split(",").map(s=>s.trim()).filter(Boolean).map(c=>{const o=DATA.find(x=>x.Code===c);return o?`<a data-jeu="${esc(c)}">${esc(c)} · ${esc(o.Titre)}</a>`:""}).join("");
  const fact=(l,v)=>v?`<div class="fact"><b>${l}</b>${esc(v)}</div>`:"";
  $("#fiche").setAttribute("style",style(g));
  $("#fiche").innerHTML=`<div class="fh"><div class="code">${esc(g.Code||"★")}</div><div class="tt"><div class="fam">${esc((g.Famille||"").toUpperCase())}${isAnniv(g)?" · FORMAT ANNIVERSAIRE":""}</div><h2>${esc(g.Titre)}</h2><div class="br">${esc(g["Résumé"])}</div></div><button class="x" aria-label="Fermer">×</button></div>
  <div class="tabs"><button class="tab on" data-p="p1">Principe</button><button class="tab" data-p="p2">Pratique</button><button class="tab" data-p="p3">Variantes</button><button class="tab" data-p="p4">Conseils</button></div>
  <div class="pane on" id="p1"><p>${boldTitles(g.Principe)}</p>${img?`<img src="${img}" alt="Schéma : ${esc(g.Titre)}" onerror="this.remove()">`:""}</div>
  <div class="pane" id="p2"><div class="facts">${fact("PARTICIPANTS",g.Participants)}${fact("MATÉRIEL",g["Matériel"])}${fact("ESPACE",g.Espace)}${fact("DURÉE",g["Durée"])}${g.Objectif?`<div class="fact obj"><b>OBJECTIF</b>${esc(g.Objectif)}</div>`:""}${fact("INTENSITÉ",g["Intensité"])}${fact("OBJECTIFS TRAVAILLÉS",g["Objectifs (tags)"])}</div></div>
  <div class="pane" id="p3"><div class="var"><div><h4>− PLUS FACILE</h4>${esc(g["Plus facile"])}</div><div><h4>+ PLUS DIFFICILE</h4>${esc(g["Plus difficile"])}</div></div></div>
  <div class="pane" id="p4">${g.Conseil?`<div class="tip"><b>CONSEIL</b> ${esc(g.Conseil)}</div>`:""}${g["Compléments"]?`<div class="comp">${esc(g["Compléments"])}</div>`:""}${voir?`<p class="voir" style="margin-top:14px"><b style="font-size:11px;letter-spacing:1px;color:var(--muted)">VOIR AUSSI</b><br>${voir}</p>`:""}${!g.Conseil&&!g["Compléments"]&&!voir?"<p>Pas de conseil particulier pour ce jeu.</p>":""}</div>
  <div class="foot"><span>${g.Auteur?"Fiche de "+esc(g.Auteur):""}</span><a class="print btn ghost" style="cursor:pointer;background:#EEF1F8;color:#26364D;padding:8px 14px;border-radius:8px;font-weight:700">Imprimer la fiche</a></div>`;
  $("#ov").classList.add("open");document.body.style.overflow="hidden";$("#ov").scrollTop=0;return true}
function syncModal(){if(MODAL&&openFiche(MODAL))return;$("#ov").classList.remove("open");document.body.style.overflow=""}
function closeFiche(){go(VIEW)}
function tab(p){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.p===p));document.querySelectorAll(".pane").forEach(x=>x.classList.toggle("on",x.id===p))}

document.addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(t){tab(t.dataset.p);return}
  const j=e.target.closest("[data-jeu]");if(j){go("jeu/"+encodeURIComponent(j.dataset.jeu));return}
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const m=e.target.closest("[data-mode]");if(m){S.mode=m.dataset.mode;render();return}
  const i=e.target.closest("[data-int]");if(i){S.int=S.int===i.dataset.int?null:i.dataset.int;render();return}
  if(e.target.id==="ov"||e.target.closest(".x")){closeFiche();return}
  if(e.target.closest(".print"))window.print();
  if(e.target.id==="shade")$("#shade").classList.remove("open"),$("#side").classList.remove("open");
});
$("#burger").addEventListener("click",()=>{$("#side").classList.add("open");$("#shade").classList.add("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&MODAL)closeFiche()});
if(CONFIG.FORM_URL)$("#propose").href=CONFIG.FORM_URL;else $("#propose").style.display="none";
route();
loadSheet().then(()=>{buildNav();render();syncModal()});
</script></body></html>
